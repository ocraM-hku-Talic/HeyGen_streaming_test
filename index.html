<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/vite.svg" type="image/svg+xml" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
    <title>TALIC Workshop HeyGen Avatar API Demo</title>
  </head>

  <body>
    <main
      class="container"
      style="display: flex; flex-direction: column; align-items: center"
    >
      <h1>TALIC Workshop HeyGen Avatar API Demo</h1>

      <!-- Video Section -->
      <article style="width: fit-content">
        <video id="avatarVideo" autoplay playsinline></video>
      </article>

      <!-- Controls Section -->
      <section>
        <section role="group">
          <button id="startSession">Start Session</button>
          <button id="endSession" disabled>End Session</button>
        </section>

        <section role="group">
          <input
            type="text"
            id="userInput"
            placeholder="Type something to the avatar to speak..."
            aria-label="User input"
          />
          <button id="speakButton" role="button">Speak</button>
          <select id="interactionMode" style="width: 200px;">
            <option value="speak">Speak</option>
            <option value="chat">Chat</option>
          </select>
        </section>

        <!-- New API Key input section -->
        <section role="group">
          <input
            type="text"
            id="apiKeyInput"
            placeholder="Enter API Key..."
            aria-label="API Key input"
          />
          <button id="setApiKeyButton" role="button">Set API Key</button>
          <button id="editApiKeyButton" role="button" disabled>Edit API Key</button>
        </section>
      </section>
      
      <section>
        <h2>Instructions:</h2>
        <ul>
          <li>Type in the Text box your HEYGEN API key and click 'set API' button</li>
          <li>Click 'Start Session' button to start the session</li> 
          <li>Select the mode you want to use</li> 
          <li>Type in the Text box what you want the avatar to say and click 'Speak' button</li>
        </p>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
